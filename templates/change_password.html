<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - GoTale Server Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon" style="width: 48px; height: 48px; font-size: 1.25rem;">G</div>
                <div style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary);">GoTale</div>
            </div>
            <h2 class="auth-title">Update Password</h2>
            <p class="auth-subtitle">Update your password before continuing</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.change_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="input-group">
                    <label>Current Password</label>
                    <input type="password" name="current_password" class="form-input" placeholder="Enter current password" required autofocus>
                </div>

                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" name="new_password" class="form-input" placeholder="Choose a new password" required>
                </div>

                <div class="input-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-input" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Update Password
                </button>
            </form>
        </div>
    </div>
    {% include 'footer.html' %}
</body>
</html>
