<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GoTale Server Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon" style="width: 48px; height: 48px; font-size: 1.25rem;">G</div>
                <div style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary);">GoTale</div>
            </div>
            <h2 class="auth-title">Sign in</h2>
            <p class="auth-subtitle">Sign in to manage your servers</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-input" placeholder="Your username" value="{{ username or '' }}" required autofocus>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Enter your password" required>
                </div>

                <label class="remember-me" style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 16px; color: var(--text-secondary); font-size: 0.875rem;">
                    <input type="checkbox" name="remember_me">
                    Remember me (182 days)
                </label>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Sign In
                </button>
            </form>
        </div>
    </div>
    {% include 'footer.html' %}
</body>
</html>
