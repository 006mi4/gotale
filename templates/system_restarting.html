<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restarting - GoTale Server Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card" style="text-align: center;">
            <div class="auth-logo">
                <div class="logo-icon" style="width: 48px; height: 48px; font-size: 1.25rem;">G</div>
            </div>
            <h2 class="auth-title">Restarting Web Interface</h2>
            <p class="auth-subtitle" id="restartStatus">Please wait while the web interface restarts.</p>
            <div style="margin-top: 20px;">
                <div style="width: 40px; height: 40px; border: 3px solid var(--border); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
            </div>
            <p style="margin-top: 16px; color: var(--text-muted); font-size: 0.8rem;">If this takes too long, reload the page.</p>
        </div>
    </div>
    {% include 'footer.html' %}
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        (function() {
            const statusEl = document.getElementById('restartStatus');
            let attempts = 0;
            const maxAttempts = 90;

            const poll = async () => {
                attempts += 1;
                try {
                    const response = await fetch('/api/system/health', { cache: 'no-store' });
                    if (response.ok || [401, 403, 302].includes(response.status)) {
                        window.location.href = '/login';
                        return;
                    }
                } catch (error) {
                    // Expected during restart.
                }

                if (attempts >= maxAttempts) {
                    statusEl.textContent = 'Restart is taking longer than expected. Please reload the page.';
                    return;
                }
                setTimeout(poll, 2000);
            };

            setTimeout(poll, 1500);
        })();
    </script>
</body>
</html>
